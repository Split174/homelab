apiVersion: v1
kind: ConfigMap
metadata:
  name: remnawave-subscription-page-config
  namespace: remnawave
data:
  APP_PORT: "3010"
  REMNAWAVE_PANEL_URL: "http://remnawave:3000"
  TRUST_PROXY: "1"
  # Serve the subscription page under the fans.themiple.ru root.
  # Set e.g. "sub" to serve it at fans.themiple.ru/sub instead.
  CUSTOM_SUB_PREFIX: ""
  MARZBAN_LEGACY_LINK_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remnawave-subscription-page
  namespace: remnawave
  labels:
    app: remnawave-subscription-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remnawave-subscription-page
  template:
    metadata:
      labels:
        app: remnawave-subscription-page
    spec:
      containers:
        - name: subscription-page
          image: remnawave/subscription-page:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: remnawave-subscription-page-config
            - secretRef:
                name: remnawave-secrets
          ports:
            - name: http
              containerPort: 3010
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
