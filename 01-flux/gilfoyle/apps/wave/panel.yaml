apiVersion: v1
kind: ConfigMap
metadata:
  name: remnawave-config
  namespace: remnawave
data:
  APP_PORT: "3000"
  METRICS_PORT: "3001"
  API_INSTANCES: "1"
  # Redis (Valkey) – see valkey.yaml
  REDIS_HOST: remnawave-redis
  REDIS_PORT: "6379"
  # Public URLs. Panel -> wave, subscription page -> fans.
  FRONT_END_DOMAIN: "https://wave.themiple.ru"
  SUB_PUBLIC_DOMAIN: "https://fans.themiple.ru"
  PANEL_DOMAIN: "wave.themiple.ru"
  # Auth
  JWT_AUTH_LIFETIME: "12"
  SHORT_UUID_LENGTH: "16"
  # Prometheus metrics basic auth user (password lives in the Secret)
  METRICS_USER: "prometheus"
  # Logging
  IS_HTTP_LOGGING_ENABLED: "false"
  ENABLE_DEBUG_LOGS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remnawave
  namespace: remnawave
  labels:
    app: remnawave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remnawave
  template:
    metadata:
      labels:
        app: remnawave
    spec:
      containers:
        - name: remnawave
          image: remnawave/backend:3
          imagePullPolicy: IfNotPresent
          env:
            # Connection string auto-generated by CloudNativePG
            # (`remnawave-db-app` secret, key `uri`)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: remnawave-db-app
                  key: uri
          envFrom:
            - configMapRef:
                name: remnawave-config
            - secretRef:
                name: remnawave-secrets
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 3001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
