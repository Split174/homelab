apiVersion: v1
kind: Service
metadata:
  name: ss-zapret
  namespace: zapret
  labels:
    app: ss-zapret2
spec:
  # NodePort для доступа из Wi-Fi-сети: прокси socks5h://<node-ip>:30888
  type: NodePort
  selector:
    app: ss-zapret2
  ports:
    - name: socks
      port: 1080
      targetPort: socks
      nodePort: 30888
      protocol: TCP
